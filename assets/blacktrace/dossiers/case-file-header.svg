<svg xmlns="http://www.w3.org/2000/svg"
     width="1200"
     height="360"
     viewBox="0 0 1200 360"
     role="img"
     aria-labelledby="title desc">

  <title id="title">BLACKTRACE Classified Case File</title>
  <desc id="desc">A dark cybercrime investigation dossier with crimson surveillance graphics.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#11141B"/>
      <stop offset="55%" stop-color="#08090D"/>
      <stop offset="100%" stop-color="#190B11"/>
    </linearGradient>

    <linearGradient id="redline">
      <stop offset="0%" stop-color="#67131F"/>
      <stop offset="50%" stop-color="#FF5263"/>
      <stop offset="100%" stop-color="#67131F"/>
    </linearGradient>

    <radialGradient id="glow">
      <stop offset="0%" stop-color="#EF334A" stop-opacity=".20"/>
      <stop offset="100%" stop-color="#EF334A" stop-opacity="0"/>
    </radialGradient>

    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32"
            fill="none"
            stroke="#FFFFFF"
            stroke-opacity=".035"
            stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="360" fill="url(#background)"/>
  <rect width="1200" height="360" fill="url(#grid)"/>
  <ellipse cx="950" cy="170" rx="300" ry="250" fill="url(#glow)"/>

  <!-- Outer dossier frame -->
  <rect x="18" y="18" width="1164" height="324"
        rx="5"
        fill="none"
        stroke="#67131F"
        stroke-width="2"/>

  <!-- Corner details -->
  <path d="M18 65V18H65 M1135 18H1182V65
           M18 295V342H65 M1135 342H1182V295"
        fill="none"
        stroke="#EF334A"
        stroke-width="4"/>

  <!-- Header strip -->
  <rect x="34" y="34" width="1132" height="38"
        fill="#67131F"
        fill-opacity=".35"/>

  <text x="52" y="59"
        fill="#FF5263"
        font-family="Consolas, monospace"
        font-size="16"
        letter-spacing="4">
    BLACKTRACE // INVESTIGATION UNIT
  </text>

  <text x="1148" y="59"
        text-anchor="end"
        fill="#F1F3F5"
        font-family="Consolas, monospace"
        font-size="13">
    SYSTEM ACTIVE
  </text>

  <!-- Main title -->
  <text x="58" y="145"
        fill="#F1F3F5"
        font-family="Segoe UI, Arial, sans-serif"
        font-size="57"
        font-weight="800"
        letter-spacing="2">
    CASE FILE // 001
  </text>

  <rect x="60" y="164" width="520" height="3"
        fill="url(#redline)"/>

  <text x="62" y="207"
        fill="#FF5263"
        font-family="Consolas, monospace"
        font-size="19"
        letter-spacing="5">
    CLASSIFIED // PERSONNEL DOSSIER
  </text>

  <text x="62" y="253"
        fill="#9299A5"
        font-family="Segoe UI, Arial, sans-serif"
        font-size="20">
    DIGITAL FOOTPRINT // SOFTWARE ENGINEERING
  </text>

  <!-- Right evidence panel -->
  <rect x="785" y="93" width="335" height="190"
        rx="4"
        fill="#11141B"
        stroke="#67131F"
        stroke-width="2"/>

  <text x="808" y="123"
        fill="#FF5263"
        font-family="Consolas, monospace"
        font-size="13"
        letter-spacing="3">
    EVIDENCE STATUS
  </text>

  <!-- Radar / target motif -->
  <circle cx="952" cy="190" r="65"
          fill="none"
          stroke="#67131F"
          stroke-width="2"/>

  <circle cx="952" cy="190" r="47"
          fill="none"
          stroke="#EF334A"
          stroke-opacity=".65"
          stroke-width="1.5"/>

  <circle cx="952" cy="190" r="27"
          fill="none"
          stroke="#FF5263"
          stroke-opacity=".8"
          stroke-width="1.5"/>

  <path d="M952 125V255 M887 190H1017"
        stroke="#EF334A"
        stroke-opacity=".35"
        stroke-width="1"/>

  <circle cx="952" cy="190" r="5" fill="#FF5263"/>

  <path d="M952 190L1000 152"
        stroke="#FF5263"
        stroke-width="3"
        stroke-linecap="round"/>

  <text x="952" y="274"
        text-anchor="middle"
        fill="#D6B36A"
        font-family="Consolas, monospace"
        font-size="12"
        letter-spacing="2">
    TRACKING ACTIVE
  </text>

  <!-- Footer -->
  <path d="M48 306H1152"
        stroke="#67131F"
        stroke-width="1"/>

  <text x="58" y="327"
        fill="#9299A5"
        font-family="Consolas, monospace"
        font-size="12"
        letter-spacing="2">
    ACCESS LEVEL // RESTRICTED
  </text>

  <text x="1140" y="327"
        text-anchor="end"
        fill="#FF5263"
        font-family="Consolas, monospace"
        font-size="12">
    BT-001 // END OF RECORD
  </text>

</svg>
