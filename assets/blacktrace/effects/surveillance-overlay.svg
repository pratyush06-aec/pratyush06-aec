
<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="420"
     viewBox="0 0 1200 420">

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#08090D"/>
      <stop offset="100%" stop-color="#171019"/>
    </linearGradient>

    <pattern id="grid" width="32" height="32"
             patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32"
            fill="none" stroke="#9299A5"
            stroke-opacity=".10" stroke-width="1"/>
    </pattern>

    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#EF334A" stop-opacity="0"/>
      <stop offset="50%" stop-color="#EF334A" stop-opacity=".12"/>
      <stop offset="100%" stop-color="#EF334A" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="420" fill="url(#background)"/>
  <rect width="1200" height="420" fill="url(#grid)"/>

  <rect x="14" y="14" width="1172" height="392"
        fill="none" stroke="#67131F" stroke-width="2"/>

  <path d="M14 65V14H85 M1115 14H1186V65
           M14 355V406H85 M1115 406H1186V355"
        fill="none" stroke="#EF334A" stroke-width="5"/>

  <text x="42" y="52" fill="#EF334A"
        font-family="Consolas, monospace"
        font-size="17" letter-spacing="5">
    BLACKTRACE // SURVEILLANCE NETWORK
  </text>

  <text x="1155" y="52" text-anchor="end"
        fill="#38D996" font-family="Consolas, monospace"
        font-size="12" letter-spacing="2">
    SYSTEM ONLINE
  </text>

  <!-- Surveillance viewport -->
  <rect x="42" y="82" width="735" height="270"
        rx="4" fill="#0B0D12"
        stroke="#67131F" stroke-width="2"/>

  <rect x="43" y="83" width="733" height="268"
        fill="url(#grid)"/>

  <rect x="43" y="83" width="733" height="268"
        fill="url(#scan)"/>

  <!-- Viewport corner indicators -->
  <path d="M58 110V96H82 M737 96H761V120
           M58 324V338H82 M737 338H761V314"
        fill="none" stroke="#EF334A" stroke-width="3"/>

  <!-- Targeting system -->
  <g transform="translate(410 217)" fill="none"
     stroke="#EF334A">
    <circle r="74" stroke-opacity=".55" stroke-width="1.5"/>
    <circle r="52" stroke-opacity=".75" stroke-width="1.5"/>
    <circle r="24" stroke-width="2"/>
    <path d="M-105 0H-32 M32 0H105
             M0 -105V-32 M0 32V105"
          stroke-width="1.5"/>
    <path d="M-12 -12L12 12 M12 -12L-12 12"
          stroke-width="1"/>
    <circle r="4" fill="#EF334A"/>
  </g>

  <text x="65" y="119" fill="#9299A5"
        font-family="Consolas, monospace" font-size="11"
        letter-spacing="2">
    CAMERA // 001
  </text>

  <text x="752" y="119" text-anchor="end"
        fill="#EF334A" font-family="Consolas, monospace"
        font-size="11">
    TRACKING ACTIVE
  </text>

  <text x="65" y="331" fill="#9299A5"
        font-family="Consolas, monospace" font-size="11">
    LAT // 23.6739 N
  </text>

  <text x="752" y="331" text-anchor="end"
        fill="#9299A5" font-family="Consolas, monospace"
        font-size="11">
    LONG // 86.9524 E
  </text>

  <!-- Right status panel -->
  <rect x="801" y="82" width="357" height="270"
        rx="4" fill="#11141B"
        stroke="#67131F" stroke-width="2"/>

  <text x="828" y="119" fill="#EF334A"
        font-family="Consolas, monospace"
        font-size="14" letter-spacing="3">
    SYSTEM TELEMETRY
  </text>

  <path d="M828 136H1132" stroke="#67131F"/>

  <g font-family="Consolas, monospace" font-size="12">
    <text x="828" y="170" fill="#9299A5">NETWORK</text>
    <text x="1132" y="170" text-anchor="end"
          fill="#38D996">CONNECTED</text>

    <text x="828" y="208" fill="#9299A5">TRACE STATUS</text>
    <text x="1132" y="208" text-anchor="end"
          fill="#38D996">ACTIVE</text>

    <text x="828" y="246" fill="#9299A5">ENCRYPTION</text>
    <text x="1132" y="246" text-anchor="end"
          fill="#F1F3F5">ENABLED</text>

    <text x="828" y="284" fill="#9299A5">ACCESS LEVEL</text>
    <text x="1132" y="284" text-anchor="end"
          fill="#EF334A">RESTRICTED</text>
  </g>

  <path d="M828 303H1132" stroke="#67131F"/>

  <text x="828" y="328" fill="#D6B36A"
        font-family="Consolas, monospace"
        font-size="11" letter-spacing="1">
    MONITORING CHANNEL // 01
  </text>

  <text x="42" y="383" fill="#9299A5"
        font-family="Consolas, monospace"
        font-size="11" letter-spacing="2">
    CLASSIFICATION // INTERNAL INVESTIGATION
  </text>

  <text x="1158" y="383" text-anchor="end"
        fill="#EF334A" font-family="Consolas, monospace"
        font-size="11" letter-spacing="2">
    BT-003 // SURVEILLANCE LOG
  </text>

</svg>
