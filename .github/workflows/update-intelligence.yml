
name: BLACKTRACE Intelligence Division

on:
  schedule:
    - cron: "23 0 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-intelligence:
    name: Generate Intelligence Report
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Generate BLACKTRACE GitHub Metrics
        uses: lowlighter/metrics@latest

        with:
          token: ${{ secrets.METRICS_TOKEN }}

          user: pratyush06-aec

          filename: blacktrace-intelligence.svg

          committer_branch: main

          committer_message: "chore: refresh BLACKTRACE intelligence [Skip GitHub Action]"

          output_action: commit

          config_output: svg

          config_timezone: Asia/Kolkata

          config_animations: yes

          config_base64: yes

          base: header, activity, community, repositories, metadata

          plugin_languages: yes

          plugin_languages_limit: 6

          plugin_languages_details: percentage

          plugin_languages_other: yes

          plugin_isocalendar: yes

          plugin_isocalendar_duration: half-year

          template: terminal
