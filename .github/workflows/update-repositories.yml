
name: BLACKTRACE Repository Intelligence

on:
  workflow_dispatch:

  schedule:
    # Every Monday at 01:17 UTC (06:47 IST)
    - cron: "17 1 * * 1"

permissions:
  contents: write

concurrency:
  group: blacktrace-repository-intelligence
  cancel-in-progress: false

jobs:
  generate-repository-intelligence:
    name: Generate Repository Intelligence
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Generate repository intelligence SVG
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/generate_repositories.py \
            --output assets/blacktrace-repositories.svg

      - name: Validate generated SVG
        run: |
          python -c "import xml.etree.ElementTree as ET; ET.parse('assets/blacktrace-repositories.svg'); print('SVG XML validation: PASSED')"

      - name: Commit updated SVG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/blacktrace-repositories.svg

          if git diff --cached --quiet; then
            echo "No repository intelligence changes detected."
          else
            git commit -m "chore: refresh BLACKTRACE repository intelligence"
            git push
          fi
