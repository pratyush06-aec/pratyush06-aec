
name: Generate BLACKTRACE contribution snake

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: pratyush06-aec
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%23E3263B&color_dots=%2308090D,%230B3D2E,%230B6E4F,%2300A86B,%2300FF9C
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%23E3263B
            dist/github-contribution-grid-snake.gif?color_snake=%23E3263B&color_dots=%2308090D,%230B3D2E,%230B6E4F,%2300A86B,%2300FF9C&color_background=%2308090D

      - name: Publish generated assets
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
